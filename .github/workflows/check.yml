name: Refurbed-Check

on:
  schedule:
    - cron: "0 7,12,18 * * *" # 8, 13, 19 Uhr deutscher Winterzeit
  workflow_dispatch:
    inputs:
      test:
        description: "Test-Nachricht schicken"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check.py ${{ inputs.test && '--test' || '' }}
      - name: Gesehene Angebote speichern
        run: |
          git config user.name "refurbed-bot"
          git config user.email "refurbed-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen.json aktualisiert" && git push)
