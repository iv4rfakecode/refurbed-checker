name: Refurbed-Check

on:
  schedule:
    - cron: "0 * * * *" # gründlicher Check, stündlich
    - cron: "15,30,45 * * * *" # Schnell-Check dazwischen
  workflow_dispatch:
    inputs:
      test:
        description: "Test-Nachricht schicken"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refurbed-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check.py ${{ github.event.schedule == '15,30,45 * * * *' && '--quick' || '' }} ${{ inputs.test && '--test' || '' }}
      - name: Gesehene Angebote speichern
        run: |
          git config user.name "refurbed-bot"
          git config user.email "refurbed-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen.json aktualisiert" && git pull --rebase && git push)
